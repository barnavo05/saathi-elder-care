<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saathi, a medication companion for elders and their families</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3EC;--ink:#14130F;--mut:#6E6A5E;--line:#E2DDCF;--card:#FCFAF5;--acc:#0E7A5F;--soft:#DCEAE3}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px}
html.xl{font-size:21px}
body{background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:110px}
button{font:inherit;color:inherit;cursor:pointer}
nav{position:sticky;top:0;z-index:20;background:rgba(246,243,236,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{max-width:1040px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.25rem;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);display:inline-block}
.tabs{display:flex;gap:22px;margin-left:auto}
.tab{background:none;border:0;padding:6px 0;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;transition:color .3s,border-color .3s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-color:var(--ink)}
.xlbtn{border:1.5px solid var(--line);background:none;border-radius:10px;padding:4px 10px;font-weight:700;color:var(--mut)}
main{max-width:1040px;margin:0 auto;padding:0 24px}
.view{animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chap{font-size:.8rem;letter-spacing:.1em;color:var(--mut);margin:56px 0 14px;font-variant-numeric:tabular-nums;font-weight:600}
h1{font-size:clamp(2.6rem,8vw,5.6rem);font-weight:800;letter-spacing:-.045em;line-height:.94}
h1 em{font-style:normal;color:var(--acc)}
.sub{color:var(--mut);font-size:1.1rem;margin-top:18px;max-width:560px}
h2{font-size:1.5rem;font-weight:700;letter-spacing:-.03em}
.next{margin-top:40px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.next .lbl{font-size:.8rem;letter-spacing:.1em;color:var(--mut);font-weight:600;text-transform:uppercase}
.next .big{font-size:clamp(1.8rem,5vw,3rem);font-weight:800;letter-spacing:-.04em;line-height:1.02;margin:10px 0 6px}
.next .note{color:var(--mut)}
.btn{background:var(--ink);color:#fff;border:0;border-radius:16px;padding:18px 28px;font-weight:700;font-size:1.05rem;transition:transform .25s,background .3s}
.btn:hover{transform:translateY(-1px)}
.btn.acc{background:var(--acc)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:10px 16px;font-size:.9rem;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.prog{margin-top:32px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .8s ease}
.prog b{font-variant-numeric:tabular-nums}
.grp{margin-top:44px}
.grp h3{font-size:.8rem;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;font-weight:600;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.row{display:grid;grid-template-columns:92px 1fr auto;gap:16px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
.row .t{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem}
.row .n{font-size:1.2rem;font-weight:700;letter-spacing:-.02em}
.row .d{color:var(--mut);font-size:.95rem}
.st{font-weight:700;font-size:.9rem}
.st.ok{color:var(--acc)}
.st.due{color:var(--ink)}
.st.miss{background:var(--ink);color:#fff;padding:4px 10px;border-radius:8px}
.st.up{color:var(--mut);font-weight:500}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:.85rem;margin-left:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:36px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px}
textarea{width:100%;min-height:210px;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:16px;font:inherit;resize:vertical;line-height:1.5}
textarea:focus{outline:none;border-color:var(--ink)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.hint{color:var(--mut);font-size:.85rem;margin-top:12px}
.med{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.med:last-child{border-bottom:0}
.med b{font-size:1.1rem;letter-spacing:-.02em}
.warn{padding:18px 20px;border-radius:16px;margin-top:12px;border:1.5px solid var(--ink)}
.warn.high{background:var(--ink);color:#fff}
.warn .tag{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.75}
.warn strong{display:block;font-size:1.05rem;margin:4px 0 4px}
.warn.low{border-color:var(--line);background:var(--card)}
.ok-box{padding:16px 20px;border-radius:16px;background:var(--soft);margin-top:12px;font-weight:600}
.alert{margin-top:36px;background:var(--ink);color:#fff;border-radius:24px;padding:30px;display:flex;gap:24px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.alert h2{font-size:1.9rem;letter-spacing:-.04em}
.alert p{opacity:.75;margin-top:6px}
.good{margin-top:36px;background:var(--soft);border-radius:24px;padding:30px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}
.stat{border-top:1px solid var(--ink);padding-top:14px}
.stat b{display:block;font-size:clamp(2.2rem,6vw,3.8rem);font-weight:800;letter-spacing:-.05em;line-height:1}
.stat span{color:var(--mut);font-size:.9rem}
.chart{display:flex;gap:12px;align-items:flex-end;height:170px;margin-top:22px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.col i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:#CFCABB;transition:height .8s ease;min-height:4px}
.col.today i{background:var(--acc)}
.col small{font-size:.75rem;color:var(--mut);font-weight:600}
.col em{font-style:normal;font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums}
.demo{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:16px;padding:8px 10px;display:flex;gap:6px;align-items:center;z-index:30;max-width:calc(100vw - 24px);overflow-x:auto;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.demo span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.6;padding:0 8px;white-space:nowrap}
.chip{background:transparent;border:0;color:#fff;padding:8px 12px;border-radius:10px;font-weight:600;font-size:.85rem;white-space:nowrap;opacity:.7;transition:all .25s}
.chip.on{background:#fff;color:var(--ink);opacity:1}
.toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;z-index:40;animation:fade .4s ease both;max-width:90vw;text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes rot{to{transform:rotate(360deg)}}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--mut);margin-right:6px}
.foot{margin-top:70px;color:var(--mut);font-size:.85rem;border-top:1px solid var(--line);padding-top:20px}
@media(max-width:760px){.two{grid-template-columns:1fr}.next{grid-template-columns:1fr;padding:24px}.row{grid-template-columns:70px 1fr}.row .act{grid-column:1/-1}.tabs{margin-left:0;width:100%}.stats{grid-template-columns:1fr 1fr 1fr;gap:10px}.alert{padding:24px}}
</style>
</head>
<body>
<nav><div class="nav">
  <div class="brand"><span class="dot"></span>Saathi</div>
  <div class="tabs" id="tabs"></div>
  <button class="xlbtn" data-a="xl" title="Larger text">A+</button>
</div></nav>
<main id="app"></main>
<div class="demo" id="demo"></div>
<div id="toastbox"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const fmt=m=>{let h=Math.floor(m/60),mi=m%60,ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+pad(mi)+" "+ap};
const toMin=t=>{const p=t.split(":").map(Number);return p[0]*60+p[1]};
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY=dkey(new Date());
const KEY="saathi-v1";
const PERSON="Ramesh";

const seedMeds=[
 {id:"m1",name:"Metformin",dose:"500 mg",times:["08:00","20:00"],note:"With food",from:"2000-01-01"},
 {id:"m2",name:"Amlodipine",dose:"5 mg",times:["08:00"],note:"For blood pressure",from:"2000-01-01"},
 {id:"m3",name:"Aspirin",dose:"75 mg",times:["14:00"],note:"After lunch",from:"2000-01-01"},
 {id:"m4",name:"Atorvastatin",dose:"10 mg",times:["21:00"],note:"At bedtime",from:"2000-01-01"}
];

let S=null,view="today",R={text:"",file:null,pending:null,warnings:[],busy:false,err:"",aiBusy:false,usedAI:false};
let sample=null,sampleImages=false,summary="",sumBusy=false;

function load(){try{const j=localStorage.getItem(KEY);if(j)return JSON.parse(j)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function dosesFor(day){
  const out=[];
  S.meds.forEach(m=>{ if(m.from>day)return; m.times.forEach(t=>out.push({id:m.id+"@"+t,med:m,time:t,min:toMin(t)})) });
  return out.sort((a,b)=>a.min-b.min);
}
function seedHistory(){
  let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=1;i<=6;i++){
    const d=new Date();d.setDate(d.getDate()-i);const k=dkey(d);S.taken[k]={};
    dosesFor(k).forEach(x=>{ if(rnd()<0.83) S.taken[k][x.id]=x.min+Math.floor(rnd()*40) });
  }
}
S=load();
if(!S||!S.meds){S={meds:seedMeds,taken:{},demo:8*60+20};seedHistory();save()}
if(!S.taken[TODAY])S.taken[TODAY]={};

function nowMin(){ if(S.demo==null){const d=new Date();return d.getHours()*60+d.getMinutes()} return S.demo }
function status(d,day){
  const tk=(S.taken[day]||{});
  if(tk[d.id]!=null)return"taken";
  if(day<TODAY)return"missed";
  const m=nowMin();
  if(m<d.min-45)return"upcoming";
  if(m<=d.min+90)return"due";
  return"missed";
}
const toast=msg=>{const b=$("#toastbox");b.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>b.innerHTML="",2800)};

/* ---------- safety rules (offline, always available) ---------- */
const RULES=[
 {a:["warfarin"],b:["aspirin"],sev:"high",t:"Warfarin with aspirin",p:"Both thin the blood. Together they raise the chance of serious bleeding. Please check with the doctor before starting."},
 {a:["warfarin"],b:["ibuprofen","diclofenac","naproxen"],sev:"high",t:"Warfarin with an anti-inflammatory painkiller",p:"These painkillers can cause stomach bleeding and make warfarin stronger. Ask the doctor about a safer option such as paracetamol."},
 {a:["aspirin"],b:["ibuprofen","naproxen","diclofenac"],sev:"medium",t:"Aspirin with another painkiller",p:"Taking these together can irritate the stomach and may weaken aspirin's heart protection."},
 {a:["amlodipine"],b:["simvastatin"],sev:"medium",t:"Amlodipine with simvastatin",p:"This pair can raise the statin level in the blood. The dose usually needs a limit."},
 {a:["clopidogrel"],b:["omeprazole","esomeprazole"],sev:"medium",t:"Clopidogrel with omeprazole",p:"Omeprazole can make clopidogrel work less well. Pantoprazole is often preferred."},
 {a:["lisinopril","enalapril","ramipril"],b:["potassium"],sev:"medium",t:"BP tablet with potassium",p:"Together they can push potassium too high, which affects the heart rhythm."}
];
const hit=(name,terms)=>terms.some(t=>name.includes(t));
function localCheck(items){
  const exist=S.meds.map(m=>({n:m.name.toLowerCase(),isNew:false}));
  const nw=items.map(i=>({n:i.name.toLowerCase(),isNew:true}));
  const all=exist.concat(nw),out=[];
  RULES.forEach(r=>{
    for(const x of all){for(const y of all){
      if(x===y)continue;
      if(!(x.isNew||y.isNew))continue;
      if(hit(x.n,r.a)&&hit(y.n,r.b)){ if(!out.find(o=>o.t===r.t))out.push({sev:r.sev,t:r.t,p:r.p,src:"Known interaction",pair:[x.n,y.n]}) }
    }}
  });
  nw.forEach(x=>{ if(exist.find(e=>e.n===x.n))out.push({sev:"low",t:cap(x.n)+" is already on the schedule",p:"Adding it again would double the dose. Check whether this replaces the old one.",src:"Duplicate check",pair:[x.n]}) });
  return out;
}
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;

/* ---------- prescription reading ---------- */
function extractJSON(t){const a=t.indexOf("["),b=t.lastIndexOf("]");if(a<0||b<a)throw new Error("no json");return JSON.parse(t.slice(a,b+1))}
function normItems(arr){
  return (arr||[]).filter(x=>x&&x.name).map(x=>{
    let times=Array.isArray(x.times)?x.times.filter(t=>/^\d{1,2}:\d{2}$/.test(t)).map(t=>pad(+t.split(":")[0])+":"+t.split(":")[1]):[];
    if(!times.length)times=["08:00"];
    return {name:cap(String(x.name).trim()),dose:String(x.dose||"").trim(),times:times,instruction:String(x.instruction||"").trim()};
  });
}
function localParse(txt){
  const lines=txt.split(/\n|;/).map(l=>l.trim()).filter(l=>/\b(tab|tablet|cap|capsule|syp|syrup|inj)\b/i.test(l)||/\d\s?(mg|mcg|ml)\b/i.test(l));
  return lines.map(l=>{
    const c=l.replace(/^\d+[\.\)]\s*/,"");
    const m=c.match(/(?:tab(?:let)?|cap(?:sule)?|syp|syrup|inj)\.?\s+([A-Za-z][A-Za-z\-]+)/i)||c.match(/^([A-Za-z][A-Za-z\-]+)/);
    if(!m)return null;
    const dose=(c.match(/\d+(?:\.\d+)?\s?(?:mg|mcg|g|ml)\b/i)||[""])[0];
    let times=[];
    const tm=c.match(/(\d{1,2})(?::(\d{2}))?\s?(am|pm)/i);
    if(tm){let h=(+tm[1])%12;if(/pm/i.test(tm[3]))h+=12;times=[pad(h)+":"+(tm[2]||"00")]}
    else if(/thrice|\btds\b|three times|\b3\s?x/i.test(c))times=["08:00","14:00","20:00"];
    else if(/twice|\bbd\b|\bbid\b|two times|\b2\s?x/i.test(c))times=["08:00","20:00"];
    else if(/night|\bhs\b|bedtime/i.test(c))times=["21:00"];
    else if(/evening/i.test(c))times=["18:00"];
    else if(/before breakfast/i.test(c))times=["07:30"];
    else times=["08:00"];
    const ins=(c.match(/(?:after|before|with)\s+(?:food|meals?|breakfast|lunch|dinner)|at night/i)||[""])[0];
    return {name:m[1],dose:dose,times:times,instruction:ins};
  }).filter(Boolean);
}
async function readRx(){
  if(!R.text.trim()&&!R.file){R.err="Paste the prescription text or add a photo first.";render();return}
  R.busy=true;R.err="";R.pending=null;R.warnings=[];R.usedAI=false;render();
  let items=null;
  if(sample){
    try{
      const prompt="You read medical prescriptions for an elderly patient's family. Extract every medicine. Return ONLY a JSON array, no prose, no markdown. Each item: {\"name\":string,\"dose\":string,\"times\":[\"HH:MM\" in 24h],\"instruction\":string}. Map once daily to 08:00, twice daily to 08:00 and 20:00, three times to 08:00, 14:00, 20:00, at night to 21:00, before breakfast to 07:30. If an explicit time is written, use it. Keep instruction short, like 'after food'.\n\nPrescription text (may be empty if an image is attached):\n"+R.text;
      const opts={cache:false};
      if(R.file&&sampleImages)opts.images=[R.file];
      const out=await sample(prompt,opts);
      items=normItems(extractJSON(out.text));R.usedAI=true;
    }catch(e){items=null}
  }
  if(!items||!items.length){
    if(R.text.trim())items=normItems(localParse(R.text));
    else{R.err="I could not read that photo. Try pasting the text instead.";R.busy=false;render();return}
  }
  R.busy=false;
  if(!items.length){R.err="No medicines found. Try one medicine per line, like: Tab Warfarin 5 mg once daily.";render();return}
  R.pending=items;R.warnings=localCheck(items);render();
  aiReview(items);
}
async function aiReview(items){
  if(!sample)return;
  R.aiBusy=true;render();
  try{
    const cur=S.meds.map(m=>m.name+" "+m.dose+" at "+m.times.join(",")).join("; ");
    const nw=items.map(m=>m.name+" "+m.dose+" at "+m.times.join(",")).join("; ");
    const prompt="A 72 year old patient already takes: "+cur+".\nA new prescription adds: "+nw+".\nList real, clinically recognised interactions or serious timing problems between these drugs. Return ONLY a JSON array (max 3) of {\"severity\":\"high\"|\"medium\"|\"low\",\"title\":string,\"plain\":string (one or two plain sentences a family member understands, no dashes),\"drugs\":[string,string]}. Return [] if nothing important. Do not invent interactions.";
    const out=await sample(prompt,{cache:false});
    const arr=extractJSON(out.text);
    const known=R.warnings.map(w=>w.pair||[]);
    arr.slice(0,3).forEach(a=>{
      const d=(a.drugs||[]).map(x=>String(x).toLowerCase());
      const dup=known.some(p=>p.length&&p.every(n=>d.some(x=>n.includes(x)||x.includes(n))));
      if(!dup&&a.title&&a.plain)R.warnings.push({sev:["high","medium","low"].includes(a.severity)?a.severity:"medium",t:String(a.title),p:String(a.plain),src:"AI review"});
    });
  }catch(e){}
  R.aiBusy=false;if(view==="rx")render();
}
function addPending(){
  if(!R.pending||!R.pending.length)return;
  R.pending.forEach(p=>S.meds.push({id:"m"+Date.now()+Math.floor(Math.random()*999),name:p.name,dose:p.dose,times:p.times,note:p.instruction,from:TODAY}));
  const n=R.pending.length;
  R={text:"",file:null,pending:null,warnings:[],busy:false,err:"",aiBusy:false,usedAI:false};
  save();view="today";render();toast(n+" medicine"+(n>1?"s":"")+" added to the schedule");
}

/* ---------- derived numbers ---------- */
function dayStats(day){
  const ds=dosesFor(day).filter(d=>day<TODAY||status(d,day)!=="upcoming"&&status(d,day)!=="due"||(S.taken[day]||{})[d.id]!=null);
  const total=ds.length,taken=ds.filter(d=>(S.taken[day]||{})[d.id]!=null).length;
  return {total,taken,pct:total?Math.round(taken/total*100):null};
}
function lastDays(n){const a=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push({k:dkey(d),l:["S","M","T","W","T","F","S"][d.getDay()]})}return a}

/* ---------- views ---------- */
function vToday(){
  const ds=dosesFor(TODAY),m=nowMin();
  const taken=ds.filter(d=>status(d,TODAY)==="taken").length;
  const g=m<720?"Good morning":m<1020?"Good afternoon":"Good evening";
  const nxt=ds.find(d=>status(d,TODAY)!=="taken");
  const groups=[["Morning",0,720],["Afternoon",720,1020],["Evening",1020,1260],["Night",1260,1441]];
  let h='<div class="view"><div class="chap">01 / 03 &nbsp; TODAY</div><h1>'+g+',<br><em>'+PERSON+'.</em></h1>';
  h+='<p class="sub">'+fmt(m)+' &middot; '+new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})+'. One tap when you have taken a tablet. Your family is kept in the loop.</p>';
  if(nxt){
    const st=status(nxt,TODAY);
    h+='<div class="next"><div><div class="lbl">'+(st==="missed"?"Overdue":st==="due"?"Take now":"Next dose")+' &middot; '+fmt(nxt.min)+'</div><div class="big">'+esc(nxt.med.name)+' '+esc(nxt.med.dose)+'</div><div class="note">'+esc(nxt.med.note||"")+'</div></div><button class="btn acc" data-a="take" data-id="'+esc(nxt.id)+'">I took it</button></div>';
  }else{
    h+='<div class="good"><h2>All done for today.</h2><p class="sub" style="margin-top:8px">Every dose is taken. Well done, '+PERSON+'.</p></div>';
  }
  h+='<div class="prog"><b>'+taken+' of '+ds.length+'</b> doses taken today<div class="bar"><i style="width:'+(ds.length?taken/ds.length*100:0)+'%"></i></div></div>';
  groups.forEach(g=>{
    const list=ds.filter(d=>d.min>=g[1]&&d.min<g[2]);if(!list.length)return;
    h+='<div class="grp"><h3>'+g[0]+'</h3>';
    list.forEach(d=>{
      const st=status(d,TODAY),at=S.taken[TODAY][d.id];
      let right="";
      if(st==="taken")right='<span class="st ok">Taken '+fmt(at)+'</span><button class="link" data-a="untake" data-id="'+esc(d.id)+'">undo</button>';
      else if(st==="due")right='<button class="btn sm" data-a="take" data-id="'+esc(d.id)+'">Mark taken</button>';
      else if(st==="missed")right='<span class="st miss">Missed</span> <button class="btn sm ghost" style="margin-left:8px" data-a="take" data-id="'+esc(d.id)+'">Took it late</button>';
      else right='<span class="st up">Later today</span>';
      h+='<div class="row"><div class="t">'+fmt(d.min)+'</div><div><div class="n">'+esc(d.med.name)+' '+esc(d.med.dose)+'</div><div class="d">'+esc(d.med.note||"")+'</div></div><div class="act">'+right+'</div></div>';
    });
    h+='</div>';
  });
  return h+'</div>';
}
function vRx(){
  let h='<div class="view"><div class="chap">02 / 03 &nbsp; NEW PRESCRIPTION</div><h1>Paste it.<br><em>We do the rest.</em></h1>';
  h+='<p class="sub">Drop in the doctor\'s note. Saathi reads it, builds the schedule, and checks it against what is already being taken.</p>';
  h+='<div class="two"><div class="card"><h2>1. The prescription</h2><div style="height:14px"></div>';
  h+='<textarea id="rxtext" placeholder="One medicine per line, for example:\nTab Warfarin 5 mg, once daily at 6 PM">'+esc(R.text)+'</textarea>';
  h+='<div class="acts"><button class="btn acc" data-a="read"'+(R.busy?" disabled":"")+'>'+(R.busy?'<span class="spin"></span>Reading':'Read prescription')+'</button><button class="btn ghost" data-a="sample">Use a sample</button>';
  if(sampleImages)h+='<label class="btn ghost" style="cursor:pointer">'+(R.file?"Photo added":"Add a photo")+'<input id="rxfile" type="file" accept="image/*" hidden></label>';
  h+='</div>';
  h+='<p class="hint">'+(sample?"Reads text"+(sampleImages?" and photos":"")+' with AI.':'AI is not available here, so a built in reader is used.')+' Not medical advice. Always confirm with the doctor or pharmacist.</p>';
  if(R.err)h+='<p class="hint" style="color:var(--ink);font-weight:700">'+esc(R.err)+'</p>';
  h+='</div><div class="card"><h2>2. What we found</h2>';
  if(!R.pending)h+='<p class="hint" style="margin-top:14px">Nothing yet. Try the sample prescription to see the safety check in action.</p>';
  else{
    R.pending.forEach((p,i)=>{
      h+='<div class="med"><div><b>'+esc(p.name)+' '+esc(p.dose)+'</b><div class="d" style="color:var(--mut);font-size:.9rem;margin-top:2px">'+p.times.map(t=>'<span class="pill">'+fmt(toMin(t))+'</span>').join("")+esc(p.instruction)+'</div></div><button class="link" data-a="rm" data-i="'+i+'">remove</button></div>';
    });
    h+='<h2 style="margin-top:26px">3. Safety check'+(R.aiBusy?' <span class="spin" style="margin-left:8px"></span>':"")+'</h2>';
    if(!R.warnings.length&&!R.aiBusy)h+='<div class="ok-box">No known problems found with the current medicines.</div>';
    R.warnings.sort((a,b)=>"high medium low".indexOf(a.sev)-"high medium low".indexOf(b.sev)).forEach(w=>{
      h+='<div class="warn '+w.sev+'"><span class="tag">'+(w.sev==="high"?"Talk to the doctor first":w.sev==="medium"?"Worth checking":"Note")+' &middot; '+esc(w.src)+'</span><strong>'+esc(w.t)+'</strong>'+esc(w.p)+'</div>';
    });
    h+='<div class="acts" style="margin-top:22px"><button class="btn" data-a="add"'+(R.pending.length?"":" disabled")+'>Add to schedule</button></div>';
    h+='<p class="hint">Saathi never changes a dose. It flags, and the doctor decides.</p>';
  }
  return h+'</div></div></div>';
}
function vFamily(){
  const ds=dosesFor(TODAY),missed=ds.filter(d=>status(d,TODAY)==="missed");
  const days=lastDays(7).map(d=>({...d,s:dayStats(d.k)}));
  const valid=days.filter(d=>d.s.pct!=null);
  const tt=valid.reduce((a,d)=>a+d.s.total,0),tk=valid.reduce((a,d)=>a+d.s.taken,0);
  const avg=tt?Math.round(tk/tt*100):0;
  let h='<div class="view"><div class="chap">03 / 03 &nbsp; FAMILY VIEW</div><h1>How is<br><em>'+PERSON+' doing?</em></h1>';
  h+='<p class="sub">For the son, daughter or carer who lives far away. Calm when things are fine, loud only when they are not.</p>';
  if(missed.length){
    h+='<div class="alert"><div><h2>'+missed.length+' missed dose'+(missed.length>1?"s":"")+' today</h2><p>'+missed.map(d=>esc(d.med.name)+" "+esc(d.med.dose)+" at "+fmt(d.min)).join(" &middot; ")+'</p></div><button class="btn acc" data-a="nudge">Nudge '+PERSON+'</button></div>';
    h+='<p class="hint">In production the nudge goes out as an SMS or WhatsApp message. Here it is simulated.</p>';
  }else h+='<div class="good"><h2>On track today.</h2><p class="sub" style="margin-top:8px">No missed doses so far.</p></div>';
  h+='<div class="stats"><div class="stat"><b>'+avg+'%</b><span>taken, last 7 days</span></div><div class="stat"><b>'+tk+'/'+tt+'</b><span>doses logged</span></div><div class="stat"><b>'+missed.length+'</b><span>missed today</span></div></div>';
  h+='<div class="card" style="margin-top:36px"><h2>Last 7 days</h2><div class="chart">';
  days.forEach((d,i)=>{h+='<div class="col'+(i===6?" today":"")+'"><em>'+(d.s.pct==null?"":d.s.pct+"%")+'</em><i style="height:'+(d.s.pct==null?4:Math.max(4,d.s.pct*1.15))+'px"></i><small>'+d.l+'</small></div>'});
  h+='</div></div>';
  h+='<div class="card" style="margin-top:20px"><h2>Weekly note</h2>';
  h+='<p class="sub" style="margin-top:10px;max-width:none;color:var(--ink)">'+(summary?esc(summary):'A short plain language summary you can read in ten seconds, or forward to a sibling.')+'</p>';
  h+='<div class="acts"><button class="btn sm" data-a="summ"'+(sumBusy?" disabled":"")+'>'+(sumBusy?'<span class="spin"></span>Writing':'Write this week\'s note')+'</button></div></div>';
  h+='<div class="grp"><h3>Today, dose by dose</h3>';
  ds.forEach(d=>{const st=status(d,TODAY),at=S.taken[TODAY][d.id];
    h+='<div class="row"><div class="t">'+fmt(d.min)+'</div><div><div class="n">'+esc(d.med.name)+' '+esc(d.med.dose)+'</div></div><div class="act">'+(st==="taken"?'<span class="st ok">Taken '+fmt(at)+'</span>':st==="missed"?'<span class="st miss">Missed</span>':st==="due"?'<span class="st due">Due now</span>':'<span class="st up">Later</span>')+'</div></div>'});
  return h+'</div></div>';
}
function render(){
  const tabs=[["today","Today"],["rx","Prescription"],["family","Family"]];
  $("#tabs").innerHTML=tabs.map(t=>'<button class="tab'+(view===t[0]?" on":"")+'" data-a="nav" data-v="'+t[0]+'">'+t[1]+'</button>').join("");
  const ta=document.activeElement&&document.activeElement.id==="rxtext";
  $("#app").innerHTML=(view==="today"?vToday():view==="rx"?vRx():vFamily())+'<div class="foot">Saathi means companion. Built solo for the Catalyst AI Hackathon 2026. Not a medical device and not medical advice.</div>';
  const chips=[["Live",null],["8:20 AM",8*60+20],["2:30 PM",14*60+30],["9:45 PM",21*60+45]];
  $("#demo").innerHTML='<span>Demo clock</span>'+chips.map(c=>'<button class="chip'+((S.demo===c[1])?" on":"")+'" data-a="clock" data-v="'+(c[1]==null?"":c[1])+'">'+c[0]+'</button>').join("")+'<button class="chip" data-a="reset">Reset</button>';
  const tx=$("#rxtext");if(tx){tx.oninput=()=>{R.text=tx.value};if(ta)tx.focus()}
  const f=$("#rxfile");if(f)f.onchange=()=>{R.file=f.files[0]||null;render()};
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  const a=el.dataset.a;
  if(a==="nav"){view=el.dataset.v;render();window.scrollTo({top:0,behavior:"smooth"})}
  else if(a==="xl"){document.documentElement.classList.toggle("xl")}
  else if(a==="take"){S.taken[TODAY][el.dataset.id]=nowMin();save();render();toast("Logged. Your family can see it.")}
  else if(a==="untake"){delete S.taken[TODAY][el.dataset.id];save();render()}
  else if(a==="clock"){S.demo=el.dataset.v===""?null:+el.dataset.v;save();render()}
  else if(a==="reset"){try{localStorage.removeItem(KEY)}catch(x){};S=null;location.reload()}
  else if(a==="sample"){R.text="Dr. A. Menon, General Physician\nPatient: Ramesh Sharma, 72 M\n1. Tab Warfarin 5 mg, once daily at 6 PM\n2. Tab Pantoprazole 40 mg, before breakfast\n3. Tab Ibuprofen 400 mg, twice daily after food";R.pending=null;R.warnings=[];R.err="";render()}
  else if(a==="read"){readRx()}
  else if(a==="rm"){R.pending.splice(+el.dataset.i,1);R.warnings=localCheck(R.pending);render()}
  else if(a==="add"){addPending()}
  else if(a==="nudge"){toast("Nudge sent to "+PERSON+" (simulated)")}
  else if(a==="summ"){writeSummary()}
});
async function writeSummary(){
  const days=lastDays(7).map(d=>({...d,s:dayStats(d.k)})).filter(d=>d.s.pct!=null);
  const tt=days.reduce((a,d)=>a+d.s.total,0),tk=days.reduce((a,d)=>a+d.s.taken,0);
  const best=days.slice().sort((a,b)=>b.s.pct-a.s.pct)[0],worst=days.slice().sort((a,b)=>a.s.pct-b.s.pct)[0];
  const fallback=PERSON+" took "+tk+" of "+tt+" doses this week, about "+Math.round(tk/Math.max(tt,1)*100)+" percent. Most missed doses were in the evening, so a call around dinner time may help.";
  sumBusy=true;summary="";render();
  if(sample){
    try{
      const data=days.map(d=>d.k+": "+d.s.taken+"/"+d.s.total).join("; ");
      const out=await sample("Write exactly two short, warm sentences for a family caregiver about "+PERSON+" (72) and this week's medication adherence. Plain language, no dashes, no medical advice, no emojis. Mention one practical suggestion. Data (date: taken/scheduled): "+data,{cache:false});
      summary=out.text.trim();
    }catch(e){summary=fallback}
  }else summary=fallback;
  sumBusy=false;render();
}
function init(){
  render();
  try{
    if(window.claude&&window.claude.use){
      window.claude.use("sample").then(async s=>{
        if(!s)return;sample=s;
        try{const l=await s.limits();sampleImages=!!(l&&l.images)}catch(e){}
        render();
      }).catch(()=>{});
    }
  }catch(e){}
}
init();
</script>
</body>
